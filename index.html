  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" aria-label="Primary navigation">
      <a class="mini-mark" href="/" aria-label="Kijuki home">Kijuki</a>
      <a class="nav-link" href="/golden/">Golden <span aria-hidden="true">↗</span></a>
    </header>

    <main id="main" class="hero">
      <section class="hero-copy" aria-labelledby="page-title">
        <p class="specimen-id">Specimen 001&nbsp;&nbsp;/&nbsp;&nbsp;Est. 2026</p>
        <h1 id="page-title">Kijuki</h1>
        <p class="subtitle">The Little Ideas Lab</p>
        <p class="intro">Small experiments for a more human tomorrow.</p>
        <a class="current-project" href="/golden/">
          <span class="project-label">Current experiment</span>
          <span class="project-name">Golden</span>
          <span class="project-arrow" aria-hidden="true">↗</span>
        </a>
      </section>

      <figure class="specimen" aria-label="Translucent peony specimen">
        <div class="specimen-frame" aria-hidden="true"></div>
        <img src="assets/kijuki-specimen-bloom.jpg" alt="An ethereal translucent peony in soft blue, pink, and lilac" width="1536" height="1024" />
        <svg class="specimen-network" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
          <g class="network-lines">
            <path id="route-a" d="M34 150 L190 150 L292 249 L468 204 L616 302 L811 174 L964 238" />
            <path id="route-b" d="M105 586 L221 468 L382 506 L545 390 L716 456 L938 351" />
            <path id="route-c" d="M616 74 L616 625" />
            <path id="route-d" d="M292 249 L221 468 M468 204 L545 390 M616 302 L716 456" />
          </g>
          <g class="network-nodes">
            <circle cx="190" cy="150" r="4" />
            <circle cx="292" cy="249" r="4" />
            <circle cx="468" cy="204" r="4" />
            <circle cx="616" cy="302" r="4" />
            <circle cx="811" cy="174" r="4" />
            <circle cx="221" cy="468" r="4" />
            <circle cx="382" cy="506" r="4" />
            <circle cx="545" cy="390" r="4" />
            <circle cx="716" cy="456" r="4" />
            <circle cx="938" cy="351" r="4" />
          </g>
          <g class="network-squares">
            <rect x="256" y="221" width="72" height="56" />
            <rect x="682" y="420" width="82" height="64" />
            <rect x="784" y="145" width="55" height="55" />
          </g>
          <g class="scan-flashes">
            <rect x="256" y="221" width="72" height="56" />
            <rect x="682" y="420" width="82" height="64" />
            <rect x="784" y="145" width="55" height="55" />
          </g>
          <g class="node-rings">
            <circle cx="190" cy="150" r="4" />
            <circle cx="292" cy="249" r="4" />
            <circle cx="468" cy="204" r="4" />
            <circle cx="616" cy="302" r="4" />
            <circle cx="811" cy="174" r="4" />
            <circle cx="221" cy="468" r="4" />
            <circle cx="382" cy="506" r="4" />
            <circle cx="545" cy="390" r="4" />
            <circle cx="716" cy="456" r="4" />
            <circle cx="938" cy="351" r="4" />
          </g>
          <g class="signal-points">
            <circle r="5">
              <animateMotion path="M34 150 L190 150 L292 249 L468 204 L616 302 L811 174 L964 238" dur="8s" repeatCount="indefinite" />
            </circle>
            <circle r="4">
              <animateMotion path="M105 586 L221 468 L382 506 L545 390 L716 456 L938 351" dur="7s" begin="-3.5s" repeatCount="indefinite" />
            </circle>
            <circle r="4">
              <animateMotion path="M616 74 L616 625" dur="5s" begin="-1.5s" repeatCount="indefinite" />
            </circle>
          </g>
        </svg>
        <span class="data-tag data-tag--one" aria-hidden="true">petal.scan</span>
        <span class="data-tag data-tag--two" aria-hidden="true">28.7896,54</span>
        <span class="data-tag data-tag--three" aria-hidden="true">object.peony</span>
        <figcaption>
          <span>A study in possibility</span>
          <span>Light / Matter / Ideas</span>
        </figcaption>
      </figure>
    </main>

    <footer class="site-footer">
